[project]
name = "sport-analytics"
version = "0.1.0"
description = "Personal ETL/analytics pipeline: WHOOP + weather + moon phase, dbt + DuckDB + Airflow"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "authlib>=1.2.0",
    "requests>=2.31.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlglot>=30.18.0",
    "litellm>=1.84",
    "google-adk>=2.11.0",
]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.10.0",
    "pre-commit>=4.5.1",
    "sqlfluff>=3.0.0",
    "ruff>=0.6.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["1_elt"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["1_elt/1_load", "2_analytics"]
