models:
  - name: fct_daily_overview
    description: |
      Semantic layer fact table: one row per calendar day (from date_day of dim_dates
      through today), combining WHOOP recovery/sleep/workout metrics, moon phase
      (joined via fct_whoop_sleep_quality), and weather. This is the table the
      dashboard's overview/KPI endpoint reads from.
    materialized: table
    columns:
      - name: date_day
        description: Calendar date.
        data_tests:
          - unique
          - not_null

      - name: recovery_score
        description: WHOOP recovery score for this day (percentage), null if no recovery was recorded.

      - name: resting_heart_rate
        description: Resting heart rate for this day, beats per minute.

      - name: hrv_rmssd_milli
        description: Heart rate variability (RMSSD) for this day, in milliseconds.

      - name: sleep_performance
        description: WHOOP sleep performance score for the main (non-nap) sleep of this day.

      - name: sleep_efficiency
        description: WHOOP sleep efficiency score for the main (non-nap) sleep of this day.

      - name: moon_phase
        description: Moon phase name for this day.

      - name: moon_phase_cycle
        description: Moon phase cycle percentage for this day.

      - name: moon_illumination
        description: Moon illumination percentage for this day.

      - name: workout_count
        description: Number of WHOOP-tracked workouts on this day.

      - name: total_strain
        description: Sum of activity_strain across all workouts on this day.

      - name: max_strain
        description: Maximum activity_strain across all workouts on this day.

      - name: temperature_mean_celsius
        description: Mean local temperature for this day.

      - name: precipitation_sum_mm
        description: Total local precipitation for this day.
