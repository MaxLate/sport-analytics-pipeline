
# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'sport_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'sport_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
# The Airflow image installs packages outside the bind-mounted project.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  sport_analytics:
    +materialized: table   # default for all models

    staging:
      +materialized: view  # Staging = Views

seeds:
  +schema: seeds
