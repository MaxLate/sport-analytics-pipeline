repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  # ruff and sqlfluff run from the uv environment, so pre-commit and CI use
  # the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run sqlfluff lint
        language: system
        types: [sql]
        files: ^1_elt/2_transform/models/
      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: uv run sqlfluff fix
        language: system
        types: [sql]
        files: ^1_elt/2_transform/models/
